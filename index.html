<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd600">
  <meta name="description" content="Acesse os catálogos VONDER por categoria.">
  <title>Catálogos VONDER</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="link-page">
  <main class="linktree" id="inicio">
    <div class="brand-logo"><img src="https://www.vonder.com.br/loja/images/site/logo_da_vonder.png" alt="VONDER"></div>
    <p class="profile-label">CATÁLOGOS E MATERIAIS</p>
    <h1>VONDER</h1>
    <p class="profile-description">Encontre o material que você precisa.</p>
    <label class="search link-search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar catálogo" aria-label="Buscar catálogo"></label>
    <nav id="catalog-grid" class="link-list" aria-label="Catálogos disponíveis"></nav>
    <p id="empty" class="empty" hidden>Nenhum catálogo encontrado. Tente outro termo.</p>
    <p class="coming-soon">NOVAS CATEGORIAS EM BREVE</p>
    <footer>VONDER · CATÁLOGOS PARA CLIENTES</footer>
  </main>
  <script src="catalogos.js"></script>
  <script src="app.js"></script>
</body>
</html>
